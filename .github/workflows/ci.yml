name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar o validar el código
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Despliegue simulado
        run: |
          mkdir -p staging
          cp -r src/* staging/
          echo "Despliegue exitoso"
